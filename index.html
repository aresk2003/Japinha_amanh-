<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bora sair?🫣</title>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body { overflow: hidden; }

        #conteudo {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background:
                radial-gradient(circle at 50% 10%, rgba(255,255,255,0.45), transparent 30%),
                linear-gradient(135deg, #f8b6cf, #e889ad 50%, #c95f8b);
            overflow: hidden;
        }

        .brilho {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.75);
            animation: flutuar 4s infinite ease-in-out;
        }

        .b1 { top: 15%; left: 10%; }
        .b2 { top: 25%; right: 12%; animation-delay: 1s; }
        .b3 { bottom: 20%; left: 15%; animation-delay: 2s; }
        .b4 { bottom: 15%; right: 10%; animation-delay: 3s; }

        @keyframes flutuar {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(-15px); opacity: 1; }
        }

        .card {
            width: 100%;
            max-width: 450px;
            max-height: 95vh;
            padding: clamp(20px, 5vw, 35px);
            border-radius: 30px;
            text-align: center;
            background: rgba(255,255,255,0.17);
            border: 1px solid rgba(255,255,255,0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow:
                0 25px 70px rgba(90,20,50,0.25),
                inset 0 1px 1px rgba(255,255,255,0.4);
            position: relative;
            z-index: 5;
        }

        .gif-container {
            width: min(230px, 60vw);
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(90,20,50,0.2);
        }

        h1 {
            color: white;
            font-size: clamp(26px, 7vw, 36px);
            line-height: 1.2;
            margin: 22px 0 10px;
            text-shadow: 0 3px 12px rgba(90,20,50,0.25);
        }

        .texto {
            color: rgba(255,255,255,0.94);
            font-size: clamp(16px, 4vw, 19px);
            line-height: 1.6;
            margin: 12px 0;
        }

        .botoes {
            width: 100%;
            height: 130px;
            position: relative;
            margin-top: 20px;
            touch-action: none;
        }

        .btn {
            width: 110px;
            height: 48px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: left 0.15s ease, top 0.15s ease, transform 0.15s ease;
        }

        #sim {
            position: absolute;
            left: calc(50% - 120px);
            top: 10px;
            background: white;
            color: #d65d8b;
            box-shadow: 0 8px 25px rgba(90,20,50,0.2);
            z-index: 10;
        }

        #sim:hover { transform: scale(1.05); }

        #nao {
            position: absolute;
            left: calc(50% + 10px);
            top: 10px;
            background: rgba(80,30,50,0.85);
            color: white;
            box-shadow: 0 8px 20px rgba(50,10,30,0.2);
            z-index: 20;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #mensagem {
            display: none;
            color: white;
            font-size: 18px;
            line-height: 1.6;
            margin-top: 10px;
            animation: aparecer 0.5s ease;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .coracao {
            font-size: 45px;
            margin-top: 10px;
            animation: pulsar 1.5s infinite;
        }

        @keyframes pulsar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @media (max-width: 480px) {
            #conteudo { padding: 12px; }
            .card { padding: 18px 15px 25px; border-radius: 25px; }
            .gif-container { width: min(210px, 58vw); }
            .botoes { height: 130px; }
            .btn { width: 105px; height: 46px; }
            #sim { left: calc(50% - 112px); }
            #nao { left: calc(50% + 7px); }
        }
    </style>
</head>

<body>
<div id="conteudo">

    <div class="brilho b1"></div>
    <div class="brilho b2"></div>
    <div class="brilho b3"></div>
    <div class="brilho b4"></div>

    <div class="card">

        <div class="gif-container">
            <div
                class="tenor-gif-embed"
                data-postid="9256699292096208194"
                data-share-method="host"
                data-aspect-ratio="1"
                data-width="100%">
                <a href="https://tenor.com/view/cat-smiling-cat-ok-okay-smile-gif-9256699292096208194">
                    Cat Smiling Ok GIF
                </a>
            </div>
        </div>

        <h1>Nanda bora comer um Japa amanhã? 😌</h1>

        <p class="texto">
            Prometo risadas, fofoca e 
            obviamente, rebolar muito o queixo. 😂
        </p>

        <p class="texto">Topa? 👀</p>

        <div class="botoes" id="areaBotoes">
            <button id="sim" class="btn" type="button">SIM ❤️</button>
            <button id="nao" class="btn" type="button">NÃO</button>
        </div>

        <div id="mensagem">
            Sabia que você ia aceitar 😌❤️
        
            <div class="coracao">🥰</div>
        </div>

    </div>
</div>

<script>
    const botaoNao = document.getElementById("nao");
    const botaoSim = document.getElementById("sim");
    const area = document.getElementById("areaBotoes");

    function fugir(event) {
        if (event) event.preventDefault();

        const larguraArea = area.clientWidth;
        const alturaArea = area.clientHeight;
        const larguraBotao = botaoNao.offsetWidth;
        const alturaBotao = botaoNao.offsetHeight;
        const margem = 5;

        const maxX = Math.max(margem, larguraArea - larguraBotao - margem);
        const maxY = Math.max(margem, alturaArea - alturaBotao - margem);

        const novaX = margem + Math.random() * Math.max(0, maxX - margem);
        const novaY = margem + Math.random() * Math.max(0, maxY - margem);

        botaoNao.style.left = novaX + "px";
        botaoNao.style.top = novaY + "px";
        botaoNao.style.transform = "none";
    }

    botaoNao.addEventListener("touchstart", fugir, { passive: false });
    botaoNao.addEventListener("mouseenter", fugir);
    botaoNao.addEventListener("click", function(event) {
        event.preventDefault();
        fugir(event);
    });

    botaoSim.addEventListener("click", function() {
        area.style.display = "none";
        document.getElementById("mensagem").style.display = "block";

        setTimeout(function() {
            window.location.href = "horario.html";
        }, 1800);
    });
</script>

<script type="text/javascript" async src="https://tenor.com/embed.js"></script>
</body>
</html>
